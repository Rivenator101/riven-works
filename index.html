<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RIVEN--rivenworks</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🕷️%3C/text%3E%3C/svg%3E"/>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#050c08;--bg2:#081510;--surface:#0d1f14;
      --border:rgba(57,255,133,0.12);--accent:#39ff85;
      --accent2:#f6ad55;--accent3:#aaff00;--accent4:#f687b3;
      --accent5:#c084fc;--text:#e2e8f0;--muted:#718096;
      --glow:rgba(57,255,133,0.25);
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'DM Sans',sans-serif;
      overflow-x:hidden;
      cursor:none;
    }

    /* CURSOR */
    .cursor{position:fixed;width:12px;height:12px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
    .cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(57,255,133,0.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);}

    /* NAV */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      display:flex;justify-content:space-between;
      padding:1rem 2rem;
      background:rgba(6,8,16,0.85);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }

    nav a{color:var(--muted);text-decoration:none;font-family:'Space Mono';font-size:.7rem;}

    /* HERO */
    #hero{min-height:100vh;display:flex;align-items:center;padding:4rem 2rem;}
    .hero-name{
      font-size:clamp(3rem,8vw,7rem);
      font-family:'Syne';
      font-weight:800;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    /* CAT SECTION */
    #catWrap{
      text-align:center;
      padding:4rem 2rem;
      font-family:'Space Mono',monospace;
      position:relative;
    }

    #asciiCat{
      cursor:pointer;
      white-space:pre;
      display:inline-block;
      font-size:1rem;
      user-select:none;
    }

    #catMood{
      font-size:.65rem;
      color:var(--accent);
      letter-spacing:.2em;
      margin-bottom:1rem;
    }

    #petCount{
      color:var(--accent4);
    }

    /* FLOATING HEARTS */
    .heart{
      position:absolute;
      color:var(--accent4);
      pointer-events:none;
      animation:floatUp 1.2s ease forwards;
    }

    @keyframes floatUp{
      from{transform:translateY(0);opacity:1}
      to{transform:translateY(-60px);opacity:0}
    }

  </style>
</head>

<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="ring"></div>

<nav>
  <a href="#">rivenworks</a>
</nav>

<section id="hero">
  <div>
    <div class="hero-name">RIVEN</div>
  </div>
</section>

<!-- ================= CAT ================= -->
<section id="catWrap">
  <div id="catMood">MOOD: NEUTRAL</div>

  <pre id="asciiCat">
 /\_/\  
( o o ) 
 > ^ <
  </pre>

  <div style="font-size:.7rem;margin-top:1rem;">
    pets: <span id="petCount">0</span>
  </div>
</section>

<script>
/* ================= CURSOR ================= */
const cursor=document.getElementById("cursor");
const ring=document.getElementById("ring");

document.addEventListener("mousemove",e=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* ================= CAT SYSTEM ================= */
const cat=document.getElementById("asciiCat");
const mood=document.getElementById("catMood");
const pets=document.getElementById("petCount");

let count=0;
let last=Date.now();

const states={
  neutral:` /\\_/\\  
( o o ) 
 > ^ <`,
  happy:` /\\_/\\  
( ^ o ^ ) 
 > ^ <`,
  annoyed:` /\\_/\\  
( - - ) 
 > ^ <`,
  sleepy:` /\\_/\\  
( - - ) z
 > ^ <`
};

function setMood(text,state){
  mood.textContent="MOOD: "+text;
  cat.textContent=states[state];
}

function heart(x,y){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent="♥";
  h.style.left=x+"px";
  h.style.top=y+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1200);
}

cat.addEventListener("click",e=>{
  count++;
  pets.textContent=count;
  last=Date.now();

  heart(e.clientX,e.clientY);

  if(count%10===0){
    setMood("OVERSTIMULATED","annoyed");
  }else{
    setMood("HAPPY","happy");
  }
});

setInterval(()=>{
  const idle=Date.now()-last;
  if(idle>8000)setMood("SLEEPY","sleepy");
  else if(idle>3000)setMood("NEUTRAL","neutral");
},1000);

</script>

</body>
</html>
